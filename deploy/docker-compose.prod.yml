# The Retail ERP on the company server: database, API and web app.
# Settings and passwords come from deploy/.env on the server (never committed).
# Ports listen on 127.0.0.1 only; Nginx on the server is the only way in.
# Audit 12: each container has a memory limit, so a fault in one cannot starve the other sites on the
# server; a container that reaches it is restarted alone. Today they use well under a quarter of it.
name: retail-erp-prod

# Audit 8: logs are kept to 5 files of 20 MB per service (they grew without limit).
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 2g
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      target: api
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:?set in deploy/.env}/api
    image: retail-erp-api
    restart: unless-stopped
    mem_limit: 1536m
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Audit 1 #18: an ordinary login that owns the tables (deploy/limit-db-role.sh), not the superuser.
      DATABASE_URL: postgresql://${DB_APP_USER:-${POSTGRES_USER}}:${DB_APP_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB}?schema=public
      API_PORT: "4000"
      WEB_ORIGIN: ${PUBLIC_URL}
      COOKIE_SECURE: "true"
      # Audit 6: a nightly job missed while the API was down runs a minute after start-up.
      NIGHTLY_CATCH_UP: "1"
      TRUST_PROXY: loopback, uniquelocal
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      LEAD_ALERT_TO: ${LEAD_ALERT_TO:-}
      # Plan 15: GSTIN checks (set with deploy/set-gstin-key.sh).
      GSTINAPI_KEY: ${GSTINAPI_KEY:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4061}:4000"

  web:
    build:
      context: ..
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}/api
    image: retail-erp-web
    restart: unless-stopped
    mem_limit: 768m
    logging: *logging
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-4060}:3000"

volumes:
  pgdata:
